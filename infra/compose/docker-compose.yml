name: joymee-dev

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: joymee-postgres
    environment:
      POSTGRES_USER: joymee
      POSTGRES_PASSWORD: joymee
      POSTGRES_DB: joymee
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U joymee -d joymee']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: joymee-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: joymee-meili
    environment:
      MEILI_MASTER_KEY: joymee-dev-master-key
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - ./data/meili:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: joymee-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: joymee
      MINIO_ROOT_PASSWORD: joymee-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: joymee-mail
    ports:
      - '1025:1025'
      - '8025:8025'
